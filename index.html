<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>御图网</title>
<meta name="theme-color" content="#0f0f13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="御图网">
<meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;500;700&family=Orbitron:wght@500;700&family=Noto+Serif+SC:wght@400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f13;
    --text: #e8e6e3;
    --text-dim: #8a8690;
    --accent: #c9a87c;
    --accent-glow: rgba(201,168,124,0.25);
  }

  body {
    font-family: "Noto Serif SC", "Songti SC", "SimSun", serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
  }

  /* 全屏背景图层 */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    transition: opacity 0.8s ease;
    opacity: 0;
  }

  .bg-layer.active { opacity: 1; }

  /* 背景暗化遮罩 */
  .bg-overlay {
    position: fixed;
    inset: 0;
    z-index: 1;
    background: rgba(0,0,0,0.35);
    transition: background 0.5s ease;
    pointer-events: none;
  }

  /* 主容器 */
  .container {
    position: relative;
    z-index: 2;
    width: 100%;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  /* 实时时钟 */
  .clock {
    text-align: center;
    margin-bottom: 20px;
    margin-top: -60px;
    line-height: 1.5;
  }

  .clock-time {
    font-family: 'Rajdhani', sans-serif;
    font-size: 4.4rem;
    font-weight: 500;
    color: rgba(255,255,255,0.92);
    letter-spacing: 0.12em;
    text-shadow: 0 0 40px rgba(255,255,255,0.08), 0 2px 12px rgba(0,0,0,0.5);
  }

  .clock-date {
    font-size: 0.8rem;
    color: rgba(255,255,255,0.45);
    letter-spacing: 0.2em;
    margin-top: 4px;
    line-height: 1.6;
  }

  .clock-lunar {
    color: rgba(255,255,255,0.35);
    margin-left: 6px;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
  }

  /* 12 小时制 am/pm 标记 */
  .clock-ampm {
    font-size: 0.42em;
    font-weight: 500;
    letter-spacing: 0.12em;
    margin-left: 0.3em;
    color: rgba(255,255,255,0.6);
    vertical-align: middle;
  }

  /* 时间区域：相对定位，刷新按钮挂在时间的右上角 */
  .clock-zone {
    position: fixed;
    top: 18%;
    left: 50%;
    transform: translateX(-50%);
    z-index: 12;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  .clock-zone:active { cursor: grabbing; }

  /* 时间样式切换按钮（悬停时钟时显现，位于时间右上角） */
  .clock-style-btn {
    position: absolute;
    top: 0;
    right: -48px;
    z-index: 50;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.35s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease, transform 0.5s ease;
  }

  .clock-style-btn svg { width: 18px; height: 18px; fill: currentColor; }

  .clock-style-btn.show {
    opacity: 1;
    pointer-events: auto;
  }

  .clock-style-btn.show:hover {
    color: var(--accent);
    border-color: var(--accent);
    box-shadow: 0 0 16px var(--accent-glow);
    transform: rotate(180deg);
  }

  /* 纯净模式下隐藏右上角按钮 */
  body.clean-mode .clock-style-btn { opacity: 0 !important; pointer-events: none !important; }

  /* 按钮组 */
  .btn-group {
    display: flex;
    gap: 14px;
    margin-top: 36px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(255,255,255,0.12);
    color: var(--text);
    padding: 11px 26px;
    border-radius: 40px;
    font-family: inherit;
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.35s ease;
    letter-spacing: 0.08em;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    position: relative;
    overflow: hidden;
  }

  .btn-icon {
    width: 17px;
    height: 17px;
    flex: 0 0 auto;
    color: var(--text-dim);
    transition: color 0.3s ease;
  }

  .btn:hover .btn-icon,
  .btn.active .btn-icon { color: var(--accent); }

  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(201,168,124,0.2), transparent);
    opacity: 0;
    transition: opacity 0.35s;
  }

  .btn:hover::before { opacity: 1; }

  .btn:hover {
    border-color: var(--accent);
    box-shadow: 0 0 24px var(--accent-glow);
    transform: translateY(-2px);
  }

  .btn:active {
    transform: translateY(0) scale(0.97);
  }

  .btn.active {
    border-color: var(--accent);
    background: rgba(201,168,124,0.18);
    box-shadow: 0 0 20px var(--accent-glow);
  }

  /* 展示区域 */
  .display-area {
    width: 100%;
    max-width: 640px;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* 壁纸模式提示 */
  .wallpaper-view {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeUp 0.6s ease;
    width: 100%;
  }

  .wallpaper-view.show { display: flex; }

  .empty-state {
    color: rgba(255,255,255,0.5);
    font-size: 0.95rem;
    text-align: center;
    line-height: 1.8;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }

  /* 壁纸模式文案 */

  .wallpaper-quote {
    font-size: 1.3rem;
    line-height: 2.1;
    color: #fff;
    max-width: 480px;
    text-align: center;
    position: relative;
    padding: 0 12px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.8), 0 0 50px rgba(0,0,0,0.5);
    min-height: 2.6em;
    cursor: default;
  }

  .wallpaper-quote::before,
  .wallpaper-quote::after {
    font-size: 2rem;
    color: var(--accent);
    opacity: 0.45;
    position: absolute;
    text-shadow: 0 0 20px var(--accent-glow);
  }
  .wallpaper-quote::before { content: '\201C'; top: -22px; left: -8px; }
  .wallpaper-quote::after { content: '\201D'; bottom: -28px; right: -8px; }

  /* 文案hover操作按钮 */
  .quote-actions {
    position: absolute;
    top: -10px;
    right: -10px;
    display: flex;
    gap: 6px;
    opacity: 0;
    transform: scale(0.8);
    transition: all 0.25s ease;
  }

  .wallpaper-quote:hover .quote-actions {
    opacity: 1;
    transform: scale(1);
  }

  .quote-action-btn {
    background: rgba(0,0,0,0.45);
    border: 1px solid rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.7);
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .quote-action-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
  }

  .quote-action-btn:hover {
    color: #fff;
    background: rgba(0,0,0,0.6);
    border-color: rgba(255,255,255,0.3);
  }

  /* Toast */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,0.65);
    display: none;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }

  .modal-overlay.show { display: flex; }

  .modal {
    background: #1a1a22;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 36px 32px 28px;
    width: 340px;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 16px 60px rgba(0,0,0,0.6);
    animation: fadeUp 0.35s ease;
  }

  .modal h3 {
    font-size: 1.1rem;
    font-weight: 400;
    color: #fff;
    margin-bottom: 16px;
    letter-spacing: 0.1em;
  }

  .modal p {
    font-size: 0.85rem;
    color: rgba(255,255,255,0.5);
    line-height: 1.8;
    margin-bottom: 20px;
  }

  .modal p strong {
    color: var(--accent);
    font-weight: 500;
  }

  .modal-input {
    width: 100%;
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #fff;
    font-family: inherit;
    font-size: 0.9rem;
    outline: none;
    text-align: center;
    letter-spacing: 0.2em;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }

  .modal-input:focus {
    border-color: var(--accent);
  }

  .modal-btn {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: #1a1a1a;
    font-family: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    cursor: pointer;
    letter-spacing: 0.1em;
    transition: opacity 0.3s;
  }

  .modal-btn:hover { opacity: 0.85; }

  .modal-close {
    margin-top: 14px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.3);
    font-family: inherit;
    font-size: 0.8rem;
    cursor: pointer;
    transition: color 0.3s;
  }

  .modal-close:hover { color: rgba(255,255,255,0.6); }

  .modal-error {
    color: #e85d5d;
    font-size: 0.8rem;
    margin-bottom: 12px;
    min-height: 1.2em;
  }

  .toast {
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(201,168,124,0.92);
    color: #1a1a1a;
    padding: 10px 24px;
    border-radius: 24px;
    font-size: 0.85rem;
    opacity: 0;
    transition: all 0.4s ease;
    pointer-events: none;
    z-index: 100;
    white-space: nowrap;
    backdrop-filter: blur(8px);
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* 隐藏的图片加载器 */
  .img-loader {
    position: fixed;
    top: -9999px;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* 页脚 */
  .footer {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    display: flex;
    justify-content: center;
    gap: 24px;
    padding: 14px 0;
    pointer-events: none;
  }

  .footer a {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    transition: color 0.3s ease;
    pointer-events: auto;
  }

  .footer-icon {
    width: 14px;
    height: 14px;
    display: inline-flex;
    flex: 0 0 auto;
  }

  .footer-icon svg { width: 14px; height: 14px; }

  .footer a:hover {
    color: var(--accent);
  }

  /* 左下角全屏提示 */
  .fs-hint {
    position: fixed;
    bottom: 13px;
    left: 18px;
    z-index: 11;
    color: rgba(255,255,255,0.32);
    font-size: 0.72rem;
    letter-spacing: 0.06em;
    pointer-events: none;
    user-select: none;
    transition: opacity 0.5s ease;
  }

  /* 右下角友情链接 */
  .friend-links {
    position: fixed;
    bottom: 13px;
    right: 18px;
    z-index: 11;
    color: rgba(255,255,255,0.35);
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    transition: opacity 0.5s ease;
    pointer-events: auto;
  }

  .friend-links a {
    color: rgba(255,255,255,0.35);
    text-decoration: none;
    font-size: 0.78rem;
    letter-spacing: 0.06em;
    transition: color 0.3s ease;
  }

  .friend-links a:hover {
    color: var(--accent);
  }

  /* 纯净模式 */
  body.clean-mode .container { opacity: 0; pointer-events: none; }
  body.clean-mode .bg-overlay { background: transparent !important; }
  body.clean-mode .footer { opacity: 0; pointer-events: none; }
  body.clean-mode .fs-hint { opacity: 0; pointer-events: none; }
  body.clean-mode .friend-links { opacity: 0; pointer-events: none; }
  .container, .footer, .fs-hint, .friend-links { transition: opacity 0.5s ease; }

  /* 隐藏分类按钮（随机动漫 / 随机美女 / 特殊壁纸） */
  body.hide-category .btn-group { opacity: 0; pointer-events: none; }
  .btn-group { transition: opacity 0.5s ease; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 520px) {
    .container { padding: 32px 16px; }
    .btn { padding: 9px 18px; font-size: 0.85rem; }
    .btn-group { gap: 10px; }
    /* F11 全屏为桌面快捷键，手机端无意义且与页脚重叠，直接隐藏 */
    .fs-hint { display: none; }
    .footer { gap: 14px; padding: 10px 0 14px; flex-wrap: wrap; justify-content: center; }
    /* 手机端友情链接取消固定定位，跟随页脚流式排列在下方 */
    .friend-links {
      position: static;
      width: 100%;
      text-align: center;
    }
    /* 手机端时钟位置上移，切换按钮收紧 */
    .clock-zone { top: 12%; }
    .clock-style-btn { right: -40px; width: 38px; height: 38px; }
  }
</style>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">

    const doc = parser.parseFromString(html, 'text/html');
    const links = Array.from(doc.querySelectorAll('a'))
      .map(a => a.getAttribute('href'))
      .filter(href => href && /\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(href));
    return links.map(href => `${folder}/${href}`);
  } catch (e) {
    return [];
  }
}

  const currLayer = activeBgLayer === 'A' ? bgLayerA : bgLayerB;

  // 预加载图片
  imgLoader.onload = () => {

// 切换模式
async function switchMode(mode) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  const btnMap = { anime: 'btnAnime', beauty: 'btnBeauty', special: 'btnSpecial' };
  document.getElementById(btnMap[mode]).classList.add('active');

  const wallpaperView = document.getElementById('wallpaperView');
  const emptyEl = document.getElementById('wallpaperEmpty');

  wallpaperView.classList.add('show');

  let images;
  if (mode === 'anime') images = animeImages;
  else if (mode === 'beauty') images = beautyImages;
  else images = specialImages;

  if (images.length === 0) {
    images = await scanFolder(mode);
    if (mode === 'anime') animeImages = images;
    else if (mode === 'beauty') beautyImages = images;
    else specialImages = images;
  }

  if (images.length > 0) {
    emptyEl.style.display = 'none';
    showRandomWallpaper(images);
  } else {
    emptyEl.style.display = 'block';
    clearBackground();
  }
}

const lunarMonthNames = ['正','二','三','四','五','六','七','八','九','十','冬','腊'];
const lunarDayNames = ['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];
const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function getLunar(y, m, d) {
  const baseDate = new Date(1900, 0, 31);
  const objDate = new Date(y, m - 1, d);
  let offset = Math.floor((objDate - baseDate) / 86400000);
  let lunarY = 1900, lunarM = 1, lunarD = 1;
  let isLeap = false;
  for (let i = 1900; i < 2101 && offset > 0; i++) {
    let daysInYear = lunarYearDays(i);
    offset -= daysInYear;
    lunarY++;
  }
  if (offset < 0) { offset += lunarYearDays(--lunarY); }
  let leap = leapMonth(lunarY);
  for (let i = 1; i < 13 && offset > 0; i++) {
    if (leap > 0 && i === (leap + 1) && !isLeap) {
      --i; isLeap = true;
      let daysInMonth = leapDays(lunarY);
      offset -= daysInMonth;
    } else {
      let daysInMonth = lunarMonthDays(lunarY, i);
      offset -= daysInMonth;
    }
    if (isLeap && i === (leap + 1)) isLeap = false;
    if (!isLeap) lunarM = i > leap ? i - 1 : i;
  }
  if (offset === 0 && leap > 0 && lunarM === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; --lunarM; }
  }
  if (offset < 0) { offset += lunarMonthDays(lunarY, lunarM === leap + 1 && !isLeap ? lunarM : --lunarM); }
  lunarD = offset + 1;
  return { year: lunarY, month: lunarM, day: lunarD, isLeap, monthStr: (isLeap ? '闰' : '') + lunarMonthNames[lunarM - 1] + '月', dayStr: lunarDayNames[lunarD - 1] };
}

function lunarYearDays(y) { let sum = 348; for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0; return sum + leapDays(y); }
function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
function leapDays(y) { if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29; return 0; }
function lunarMonthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

// 格式化时间
function fmtTime(h, m, s, style) {
  const pad = n => String(n).padStart(2, '0');
  if (style.hour12) {
    const ampm = h < 12 ? 'AM' : 'PM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    const ss = style.seconds ? ':' + pad(s) : '';
    return `${pad(h12)}:${pad(m)}${ss}<span class="clock-ampm">${ampm}</span>`;
  }
  const ss = style.seconds ? ':' + pad(s) : '';
  return `${pad(h)}:${pad(m)}${ss}`;
}

// 实时时钟
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const h = now.getHours();
  const min = now.getMinutes();
  const s = now.getSeconds();
  const weekZh = weekNames[now.getDay()];
  const lunar = getLunar(y, m, d);
  const style = clockStyles[currentClockStyle];

  const clockEl = document.getElementById('clock');
  clockEl.style.fontFamily = style.font;
  clockEl.style.fontWeight = style.weight;
  clockEl.style.letterSpacing = style.tracking;

  // 日期行文案
  let dateLine = '';
  if (style.date) {
    if (style.lang === 'en') {
      dateLine = `${weekEn[now.getDay()]}, ${monthEn[m - 1]} ${d}`;
      if (style.lunar) dateLine += ` <span class="clock-lunar">${lunar.monthStr}${lunar.dayStr}</span>`;
    } else {
      dateLine = `${y}年${m}月${d}日 ${weekZh}`;
      if (style.lunar) dateLine += `<span class="clock-lunar"> ${lunar.monthStr}${lunar.dayStr}</span>`;
    }
  }

  // 手机端缩小时间字号
  let timeSize = style.timeSize;
  if (window.innerWidth <= 520) {
    const rem = parseFloat(timeSize);
    if (!isNaN(rem)) timeSize = (rem * 0.62).toFixed(2) + 'rem';
  }

  let timeStyle = `font-size:${timeSize};font-weight:${style.weight};text-shadow:${style.glow};letter-spacing:${style.tracking};`;
  if (style.gradient) {
    timeStyle += `background:${style.gradient};-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;`;
  } else {
    timeStyle += `color:${style.color};`;
  }
  if (style.bg) timeStyle += `background:${style.bg};`;
  const backdropVal = style.backdrop || (style.blur ? `blur(${style.blur})` : '');
  if (backdropVal) timeStyle += `backdrop-filter:${backdropVal};-webkit-backdrop-filter:${backdropVal};`;
  if (style.radius) timeStyle += `border-radius:${style.radius};padding:${style.pad || '0.12em 0.4em'};`;
  if (style.lh) timeStyle += `line-height:${style.lh};`;
  if (style.border) timeStyle += `border:${style.border};`;
  if (style.shadow) timeStyle += `box-shadow:${style.shadow};`;
  if (style.stroke) timeStyle += `-webkit-text-stroke:${style.stroke};`;
  const timeHtml = `<div class="clock-time" style="${timeStyle}">${fmtTime(h, min, s, style)}</div>`;
  const dateHtml = dateLine ? `<div class="clock-date" style="color:${style.dateColor};">${dateLine}</div>` : '';

  clockEl.innerHTML = timeHtml + dateHtml;

  const pill = document.getElementById('clockStyleBtn');
  if (pill) pill.title = '切换时间样式（当前：' + style.name + '）';
}

// 时间板块可拖动（鼠标 + 触摸），位置记忆
(function makeClockDraggable() {
  const zone = document.querySelector('.clock-zone');
  if (!zone) return;
  const KEY = 'clock_pos';
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const [x, y] = saved.split(',').map(Number);
      if (!isNaN(x) && !isNaN(y)) {
        zone.style.left = x + 'px';
        zone.style.top = y + 'px';
        zone.style.transform = 'none';
      }
    }
  } catch (e) {}

  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  const pos = () => { const r = zone.getBoundingClientRect(); return [r.left, r.top]; };

  function onDown(e) {
    if (e.target.closest('.clock-style-btn')) return; // 刷新按钮自身处理
    dragging = true; moved = false;
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    [ox, oy] = pos();
    zone.style.transition = 'none';
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    const r = zone.getBoundingClientRect();
    let nx = ox + dx, ny = oy + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - r.width));
    ny = Math.max(0, Math.min(ny, window.innerHeight - r.height));
    zone.style.left = nx + 'px';
    zone.style.top = ny + 'px';
    zone.style.transform = 'none';
    if (e.cancelable) e.preventDefault();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    zone.style.transition = '';
    if (moved) {
      const r = zone.getBoundingClientRect();
      try { localStorage.setItem(KEY, r.left + ',' + r.top); } catch (e) {}
      window.__clockDragged = true;
      setTimeout(() => { window.__clockDragged = false; }, 60);
    }
  }

  zone.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  zone.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
})();

// 初始化
(async function init() {
  await loadHitokotoData();
  await switchMode('anime');
  showWallpaperQuote();
})();
</script>
