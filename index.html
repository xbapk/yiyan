let beautyImages = [];

// 背景图层引用
const bgLayerA = document.getElementById('bgLayerA');
const bgLayerB = document.getElementById('bgLayerB');
const imgLoader = document.getElementById('imgLoader');

// 加载一言数据
async function loadHitokotoData() {
  try {
    const res = await fetch('data/hitokoto.txt');
    const text = await res.text();
    hitokotoList = text.split('\n').map(s => s.trim()).filter(Boolean);
  } catch (e) {
    hitokotoList = ['生活不止眼前的苟且，还有诗和远方。'];
  }
}

// 扫描文件夹图片
async function scanFolder(folder) {
  // 优先读取静态清单：GitHub Pages 等纯静态托管不提供目录索引，必须用清单
  try {
    const mres = await fetch('manifest.json', { cache: 'no-cache' });
    if (mres.ok) {
      const data = await mres.json();
      if (data && Array.isArray(data[folder]) && data[folder].length) {
        return data[folder];
      }
    }
  } catch (e) { /* 忽略，回退目录扫描 */ }

  // 回退：本地 http.server 的目录列表（仅本地预览用）
  try {
    const res = await fetch(`${folder}/`);
    const html = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    const links = Array.from(doc.querySelectorAll('a'))
      .map(a => a.getAttribute('href'))
      .filter(href => href && /\.(jpe?g|png|gif|webp|bmp|svg)$/i.test(href));
    return links.map(href => `${folder}/${href}`);
  } catch (e) {
    return [];
  }
}

// 设置全屏背景（带双缓冲淡入）
function setBackgroundImage(url) {
  const nextLayer = activeBgLayer === 'A' ? bgLayerB : bgLayerA;
  const currLayer = activeBgLayer === 'A' ? bgLayerA : bgLayerB;

  // 预加载图片
  imgLoader.onload = () => {
    nextLayer.style.backgroundImage = `url("${encodeURI(url)}")`;
    nextLayer.classList.add('active');
    currLayer.classList.remove('active');
    activeBgLayer = activeBgLayer === 'A' ? 'B' : 'A';
  };
  imgLoader.onerror = () => {
    // 加载失败时跳过
  };
  imgLoader.src = url;
}

// 清除背景
function clearBackground() {
  bgLayerA.classList.remove('active');
  bgLayerB.classList.remove('active');
  bgLayerA.style.backgroundImage = '';
  bgLayerB.style.backgroundImage = '';
}

// 切换模式
async function switchMode(mode) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  const btnMap = { anime: 'btnAnime', beauty: 'btnBeauty', special: 'btnSpecial' };
  document.getElementById(btnMap[mode]).classList.add('active');

  const wallpaperView = document.getElementById('wallpaperView');
  const emptyEl = document.getElementById('wallpaperEmpty');
  const contentEl = document.getElementById('wallpaperContent');

  wallpaperView.classList.add('show');
  currentFolder = mode;

  let images;
  if (mode === 'anime') images = animeImages;
  else if (mode === 'beauty') images = beautyImages;
  else images = specialImages;

  if (images.length === 0) {
    images = await scanFolder(mode);
    if (mode === 'anime') animeImages = images;
    else if (mode === 'beauty') beautyImages = images;
    else specialImages = images;
  }

  if (images.length > 0) {
    emptyEl.style.display = 'none';
    contentEl.style.display = 'flex';
    showRandomWallpaper(images);
  } else {
    emptyEl.style.display = 'block';
    contentEl.style.display = 'none';
    clearBackground();
  }
}

// 随机壁纸（全屏背景）
function showRandomWallpaper(images) {
  const idx = Math.floor(Math.random() * images.length);
  setBackgroundImage(images[idx]);
}

function showWallpaperQuote() {
  if (hitokotoList.length === 0) return;
  const el = document.getElementById('wallpaperQuote');
  el.style.opacity = '0';
  el.style.transform = 'translateY(10px)';
  setTimeout(() => {
    const idx = Math.floor(Math.random() * hitokotoList.length);
    document.getElementById('wallpaperQuoteSpan').textContent = hitokotoList[idx];
    el.style.transition = 'all 0.6s ease';
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  }, 300);
}

// 复制壁纸模式文案
async function copyWallpaperQuote() {
  const text = document.getElementById('wallpaperQuoteSpan').textContent;
  if (!text) {
    showToast('暂无文案可复制');
    return;
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('文案已复制到剪贴板');
  } catch {
    fallbackCopy(text);
  }
}

// 降级复制
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px';
  document.body.appendChild(ta);
  ta.select();
  try {
    document.execCommand('copy');
    showToast('已复制到剪贴板');
  } catch {
    showToast('复制失败');
  }
  document.body.removeChild(ta);
}

// Toast
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

const weekNames = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

function getLunar(y, m, d) {
  const baseDate = new Date(1900, 0, 31);
  const objDate = new Date(y, m - 1, d);
  let offset = Math.floor((objDate - baseDate) / 86400000);
  let lunarY = 1900, lunarM = 1, lunarD = 1;
  let isLeap = false;
  for (let i = 1900; i < 2101 && offset > 0; i++) {
    let daysInYear = lunarYearDays(i);
    offset -= daysInYear;
    lunarY++;
  }
  if (offset < 0) { offset += lunarYearDays(--lunarY); }
  let leap = leapMonth(lunarY);
  for (let i = 1; i < 13 && offset > 0; i++) {
    if (leap > 0 && i === (leap + 1) && !isLeap) {
      --i; isLeap = true;
      let daysInMonth = leapDays(lunarY);
      offset -= daysInMonth;
    } else {
      let daysInMonth = lunarMonthDays(lunarY, i);
      offset -= daysInMonth;
    }
    if (isLeap && i === (leap + 1)) isLeap = false;
    if (!isLeap) lunarM = i > leap ? i - 1 : i;
  }
  if (offset === 0 && leap > 0 && lunarM === leap + 1) {
    if (isLeap) { isLeap = false; } else { isLeap = true; --lunarM; }
  }
  if (offset < 0) { offset += lunarMonthDays(lunarY, lunarM === leap + 1 && !isLeap ? lunarM : --lunarM); }
  lunarD = offset + 1;
  return { year: lunarY, month: lunarM, day: lunarD, isLeap, monthStr: (isLeap ? '闰' : '') + lunarMonthNames[lunarM - 1] + '月', dayStr: lunarDayNames[lunarD - 1] };
}

function lunarYearDays(y) { let sum = 348; for (let i = 0x8000; i > 0x8; i >>= 1) sum += (lunarInfo[y - 1900] & i) ? 1 : 0; return sum + leapDays(y); }
function leapMonth(y) { return lunarInfo[y - 1900] & 0xf; }
function leapDays(y) { if (leapMonth(y)) return (lunarInfo[y - 1900] & 0x10000) ? 30 : 29; return 0; }
function lunarMonthDays(y, m) { return (lunarInfo[y - 1900] & (0x10000 >> m)) ? 30 : 29; }

  const code = document.getElementById('codeInput').value.trim();
  const errorEl = document.getElementById('modalError');
  if (!code) {
    errorEl.textContent = '请输入激活码';
    return;

  if (code === '1027') {

    closeModal();
    switchMode('special');
    showToast('激活成功');
  } else {
    errorEl.textContent = '激活码格式不正确';
  }
}

  try { localStorage.setItem('clock_style', currentClockStyle); } catch (e) {}
  updateClock();
}

// 格式化时间
function fmtTime(h, m, s, style) {
  const pad = n => String(n).padStart(2, '0');
  if (style.hour12) {
    const ampm = h < 12 ? 'AM' : 'PM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    const ss = style.seconds ? ':' + pad(s) : '';
    return `${pad(h12)}:${pad(m)}${ss}<span class="clock-ampm">${ampm}</span>`;
  }
  const ss = style.seconds ? ':' + pad(s) : '';
  return `${pad(h)}:${pad(m)}${ss}`;
}

// 实时时钟
function updateClock() {
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const y = now.getFullYear();
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const h = now.getHours();
  const min = now.getMinutes();
  const s = now.getSeconds();
  const weekZh = weekNames[now.getDay()];
  const lunar = getLunar(y, m, d);
  const style = clockStyles[currentClockStyle];

  const clockEl = document.getElementById('clock');
  clockEl.dataset.style = style.id;
  clockEl.style.fontFamily = style.font;
  clockEl.style.fontWeight = style.weight;
  clockEl.style.letterSpacing = style.tracking;

  // 日期行文案
  let dateLine = '';
  if (style.date) {
    if (style.lang === 'en') {
      dateLine = `${weekEn[now.getDay()]}, ${monthEn[m - 1]} ${d}`;
      if (style.lunar) dateLine += ` <span class="clock-lunar">${lunar.monthStr}${lunar.dayStr}</span>`;
    } else {
      dateLine = `${y}年${m}月${d}日 ${weekZh}`;
      if (style.lunar) dateLine += `<span class="clock-lunar"> ${lunar.monthStr}${lunar.dayStr}</span>`;
    }
  }

  // 手机端缩小时间字号
  let timeSize = style.timeSize;
  if (window.innerWidth <= 520) {
    const rem = parseFloat(timeSize);
    if (!isNaN(rem)) timeSize = (rem * 0.62).toFixed(2) + 'rem';
  }

  let timeStyle = `font-size:${timeSize};font-weight:${style.weight};text-shadow:${style.glow};letter-spacing:${style.tracking};`;
  if (style.gradient) {
    timeStyle += `background:${style.gradient};-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;`;
  } else {
    timeStyle += `color:${style.color};`;
  }
  if (style.bg) timeStyle += `background:${style.bg};`;
  if (style.radius) timeStyle += `border-radius:${style.radius};padding:${style.pad || '0.12em 0.4em'};`;
  if (style.stroke) timeStyle += `-webkit-text-stroke:${style.stroke};`;
  const timeHtml = `<div class="clock-time" style="${timeStyle}">${fmtTime(h, min, s, style)}</div>`;
  const dateHtml = dateLine ? `<div class="clock-date" style="color:${style.dateColor};">${dateLine}</div>` : '';

  // 支持「日期在上方」的排版（layout 为 'above' 时）
  clockEl.innerHTML = style.layout === 'above' ? dateHtml + timeHtml : timeHtml + dateHtml;

  const pill = document.getElementById('clockStyleBtn');
  if (pill) pill.title = '切换时间样式（当前：' + style.name + '）';
}
setInterval(updateClock, 1000);
updateClock();
window.addEventListener('resize', updateClock);

// 悬停时钟时，右上角显示刷新按钮（切换时间样式）；离开后延时隐藏，便于移动到按钮点击
(function bindClockStyleBtn() {
  const clockEl = document.getElementById('clock');
  const btn = document.getElementById('clockStyleBtn');
  if (!clockEl || !btn) return;
  let hideTimer;
  const show = () => { clearTimeout(hideTimer); btn.classList.add('show'); };
  const hide = () => { hideTimer = setTimeout(() => btn.classList.remove('show'), 800); };
  clockEl.addEventListener('mouseenter', show);
  clockEl.addEventListener('mouseleave', hide);
  btn.addEventListener('mouseenter', show);
  btn.addEventListener('mouseleave', hide);
})();

// 时间板块可拖动（鼠标 + 触摸），位置记忆
(function makeClockDraggable() {
  const zone = document.querySelector('.clock-zone');
  if (!zone) return;
  const KEY = 'clock_pos';
  try {
    const saved = localStorage.getItem(KEY);
    if (saved) {
      const [x, y] = saved.split(',').map(Number);
      if (!isNaN(x) && !isNaN(y)) {
        zone.style.left = x + 'px';
        zone.style.top = y + 'px';
        zone.style.transform = 'none';
      }
    }
  } catch (e) {}

  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  const pos = () => { const r = zone.getBoundingClientRect(); return [r.left, r.top]; };

  function onDown(e) {
    if (e.target.closest('.clock-style-btn')) return; // 刷新按钮自身处理
    dragging = true; moved = false;
    const p = e.touches ? e.touches[0] : e;
    sx = p.clientX; sy = p.clientY;
    [ox, oy] = pos();
    zone.style.transition = 'none';
    if (e.cancelable) e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - sx, dy = p.clientY - sy;
    if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
    const r = zone.getBoundingClientRect();
    let nx = ox + dx, ny = oy + dy;
    nx = Math.max(0, Math.min(nx, window.innerWidth - r.width));
    ny = Math.max(0, Math.min(ny, window.innerHeight - r.height));
    zone.style.left = nx + 'px';
    zone.style.top = ny + 'px';
    zone.style.transform = 'none';
    if (e.cancelable) e.preventDefault();
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    zone.style.transition = '';
    if (moved) {
      const r = zone.getBoundingClientRect();
      try { localStorage.setItem(KEY, r.left + ',' + r.top); } catch (e) {}
      window.__clockDragged = true;
      setTimeout(() => { window.__clockDragged = false; }, 60);
    }
  }

  zone.addEventListener('mousedown', onDown);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onUp);
  zone.addEventListener('touchstart', onDown, { passive: false });
  window.addEventListener('touchmove', onMove, { passive: false });
  window.addEventListener('touchend', onUp);
})();

// 初始化
(async function init() {
  await loadHitokotoData();
  await switchMode('anime');
  showWallpaperQuote();
})();
</script>
